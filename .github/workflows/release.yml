name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  WAILS_VERSION: v2.13.0
  NODE_VERSION: '24'

jobs:
  # A tag must not be able to ship a binary whose tests are red.
  test:
    name: Test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install webkit2gtk + GTK
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev pkg-config

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}

      - name: Stub embedded frontend assets
        run: |
          mkdir -p frontend/dist
          echo '<!doctype html><title>stub</title>' > frontend/dist/index.html

      - name: go test -race
        run: go test -race -tags webkit2_41 ./...

      # The frontend tests import modules that import frontend/wailsjs, which
      # is generated and gitignored — without this, vitest fails to resolve
      # ../../wailsjs/... and every suite that touches the bindings dies.
      - name: Generate Wails bindings
        run: wails generate module -tags webkit2_41

      - run: npm ci
        working-directory: frontend

      - name: Frontend tests
        run: npm test
        working-directory: frontend

  linux:
    name: Build linux/amd64
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install webkit2gtk + GTK
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev pkg-config

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}

      - name: Stamp version into wails.json
        shell: bash
        run: .github/scripts/stamp-version.sh

      - name: Build
        run: wails build -tags webkit2_41 -platform linux/amd64 -clean -trimpath

      - name: Package
        id: pkg
        run: |
          VERSION="${GITHUB_REF_NAME}"
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            VERSION="dev-${GITHUB_SHA::7}"
          fi
          NAME="fredfleet-${VERSION}-linux-amd64"
          mkdir -p dist
          tar czf "dist/${NAME}.tar.gz" -C build/bin fredfleet
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.pkg.outputs.name }}
          path: dist/*.tar.gz
          if-no-files-found: error

  macos:
    name: Build darwin/universal
    needs: test
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}

      - name: Stamp version into wails.json
        shell: bash
        run: .github/scripts/stamp-version.sh

      - name: Build
        run: wails build -platform darwin/universal -clean -trimpath

      - name: Package
        id: pkg
        run: |
          VERSION="${GITHUB_REF_NAME}"
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            VERSION="dev-${GITHUB_SHA::7}"
          fi
          NAME="fredfleet-${VERSION}-darwin-universal"
          mkdir -p dist
          ditto -c -k --keepParent build/bin/fredfleet.app "dist/${NAME}.zip"
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.pkg.outputs.name }}
          path: dist/*.zip
          if-no-files-found: error

  windows:
    name: Build windows/amd64
    needs: test
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}

      - name: Stamp version into wails.json
        shell: bash
        run: .github/scripts/stamp-version.sh

      - name: Build
        run: wails build -platform windows/amd64 -clean -trimpath

      - name: Package
        id: pkg
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME}"
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            VERSION="dev-${GITHUB_SHA::7}"
          fi
          NAME="fredfleet-${VERSION}-windows-amd64"
          mkdir -p dist
          7z a "dist/${NAME}.zip" "./build/bin/fredfleet.exe"
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.pkg.outputs.name }}
          path: dist/*.zip
          if-no-files-found: error

  release:
    name: Draft GitHub Release
    needs: [linux, macos, windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        with:
          draft: true
          generate_release_notes: true
          files: artifacts/**/*
