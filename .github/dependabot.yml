version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      go-minor-patch:
        update-types: [minor, patch]
    ignore:
      # iceberg-go and wails carry the constraints DESIGN.md documents; both
      # need a human to re-read the gotchas before moving, and wails/v2 must
      # move together with WAILS_VERSION in the workflows.
      - dependency-name: github.com/apache/iceberg-go
        update-types: [version-update:semver-major, version-update:semver-minor]
      - dependency-name: github.com/wailsapp/wails/v2
        update-types: [version-update:semver-major, version-update:semver-minor]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Majors that only work in lockstep are bundled into one PR per set:
      # vitest and @vitejs/plugin-react peer on a vite major, and React's types
      # follow React. A group only bundles what is already published, so a
      # vite major that ships before its plugin still arrives alone and fails
      # CI; close it and wait for the next run.
      build-toolchain-major:
        patterns: [vite, '@vitejs/plugin-react', vitest]
        update-types: [major]
      react-major:
        patterns: [react, react-dom, '@types/react', '@types/react-dom']
        update-types: [major]
      npm-minor-patch:
        update-types: [minor, patch]
    ignore:
      # @types/node describes the runtime, so it tracks NODE_VERSION in the
      # workflows (24), not npm's latest. Bump the major together with it.
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
